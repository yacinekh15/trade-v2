name: Halal scanner auto + manual

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Manual timeframe to scan"
        required: true
        default: "all"
        type: choice
        options: [all, 5m, 15m, 1h, 4h]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Automatic scan (checks website Auto Scan setting)
        if: ${{ github.event_name == 'schedule' }}
        env:
          DOMAIN: ${{ secrets.VERCEL_APP_DOMAIN }}
          SECRET: ${{ secrets.SCAN_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 55 \
            -X POST "https://${DOMAIN}/api/auto-scan" \
            -H "X-Scan-Secret: ${SECRET}"
      - name: Manual scan
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          DOMAIN: ${{ secrets.VERCEL_APP_DOMAIN }}
          SECRET: ${{ secrets.SCAN_SECRET }}
          TIMEFRAME: ${{ inputs.timeframe }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 2 --max-time 55 \
            -X POST "https://${DOMAIN}/api/scan?timeframe=${TIMEFRAME}" \
            -H "X-Scan-Secret: ${SECRET}"
